name: security-scan

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  psalm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/psalm --taint-analysis --no-progress
